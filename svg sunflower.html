<!DOCTYPE html>
<html>
<head>
    <title>SVG Sunflower</title>
</head>
<body>

<svg width="300" height="350" viewBox="0 0 300 350">
    <!-- Stem -->
    <rect x="145" y="170" width="10" height="120" fill="green"/>

    <!-- Leaves -->
    <ellipse cx="120" cy="220" rx="25" ry="12" fill="green" transform="rotate(-30 120 220)"/>
    <ellipse cx="180" cy="250" rx="25" ry="12" fill="green" transform="rotate(30 180 250)"/>

    <!-- Petals -->
    <g transform="translate(150 120)">
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(30)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(60)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(90)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(120)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(150)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(180)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(210)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(240)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(270)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(300)"/>
        <ellipse cx="0" cy="-60" rx="15" ry="40" fill="gold" transform="rotate(330)"/>

        <!-- Center -->
        <circle cx="0" cy="0" r="40" fill="#6b3e1e"/>
        <circle cx="0" cy="0" r="32" fill="#8b5a2b"/>
    </g>
</svg>

</body>
</html>
